; UE4SS Address Overrides for PalServer Linux (stripped binary)
; 
; The PalServer Linux binary is stripped (no .symtab, no function names).
; UE4SS needs these addresses to initialize properly.
;
; Format: key = hex address (with or without 0x prefix, uppercase hex)
; Zero values are ignored (treated as not set)
;
; Confirmed addresses from live process memory scan (2026-07-31):
; GMalloc: global FMalloc* pointer at 0xc137000 (in exe BSS segment)
; GUObjectArray: FUObjectArray struct at 0x7fa291598950 (MaxEl=442, NumEl=439)

[Signatures]
; Required for UE4SS initialization (crashes without these):
GUObjectArray = 7FA291598950
GMalloc = C137000

; Required for UE4SS mod loading and hooking:
FNameToString = 0x00000000
FNameConstructor = 0x00000000
StaticConstructObject = 0x00000000
UGameEngineTick = 0x00000000
ProcessInternal = 0x00000000
ProcessLocalScriptFunction = 0x00000000
CallFunctionByNameWithArguments = 0x00000000

; Optional (UE4SS can work without these):
GNatives = 0x00000000
