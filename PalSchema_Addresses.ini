; PalSchema Addresses Configuration for Linux
; ============================================
; This file provides manual function addresses for the Linux Palworld binary.
; Required when the binary is stripped (no debug symbols) and AOB patterns don't match.
;
; Format: FunctionName=0xADDRESS (hex) or FunctionName=ADDRESS (decimal)
;
; To find these addresses:
;   1. Use a debugger (gdb, lldb) on the Palworld binary
;   2. Use patternsleuth or similar AOB scanning tools
;   3. Use UE4SS's built-in dlsym resolution (if binary is unstripped)
;
; The addresses below are PLACEHOLDERS - you must replace them with actual
; addresses from your specific Palworld binary version.

[Signatures]
; Blueprint Loader apply logic
UBlueprintGeneratedClass::PostLoadDefaultObject=0x0

; Raw Table apply logic
FPakPlatformFile::GetPakFolders=0x0

; Important for running things on the Game Thread
AsyncTask=0x0

; Used to initialize loader logic (pals, items, etc)
AGameModeBase::InitGameState=0x0

UClass::AssembleReferenceTokenStream=0x0
UClass::GetDefaultObject=0x0
UStruct::StaticLink=0x0

; StaticFindObject (used earlier than UE4SS's own)
UObjectGlobals::StaticFindObject=0x0

; IsA (used instead of UE4SS's due to early init)
FField::IsA=0x0

; FName::Constructor (needed early)
FName::Constructor=0x0

; UPalItemContainer::ApplySaveData
UPalItemContainer::ApplySaveData=0x0

; UPalDynamicItemWorldSubsystem::ApplyWorldSaveData
UPalDynamicItemWorldSubsystem::ApplyWorldSaveData=0x0

ValidateWorldSaveDynamicItemStaticIds=0x0
ValidateDynamicItemSaveData=0x0

; Call-resolved signatures (address of CALL instruction, will be resolved to target)
FFieldClass::GetNameToFieldClassMap=0x0
FName::ToString_Wchar=0x0
GetObjectsOfClass=0x0
FMemory::Free=0x0
UDataTable::Serialize=0x0
UPalDynamicItemWorldSubsystem::Create_ServerInternal=0x0
UPalItemSlot::UpdateItem_ServerInternal=0x0
UWorld::CleanupWorld=0x0
