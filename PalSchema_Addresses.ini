; PalSchema Addresses Configuration for Linux
; ============================================
; This file provides manual function addresses for the Linux Palworld binary.
; Required when the binary is stripped (no debug symbols) and AOB patterns don't match.
;
; Format: FunctionName=0xADDRESS (hex; the 0x prefix is optional)
;
; NOTE: Functions marked [UE4SS-RESOLVED] are automatically resolved by UE4SS
; on Linux via dlsym + heuristic scan. You do NOT need to provide addresses for them.
; They are listed here for reference only.
;
; Functions marked [MANUAL] require you to provide the actual address from your
; Palworld binary. Use a debugger (gdb), disassembler (Ghidra/IDA), or
; strings + objdump analysis to find these.
;
; To find addresses:
;   1. Run: strings -t x PalServer-Linux-Shipping | grep FunctionName
;   2. Use objdump to disassemble around the string reference
;   3. Or use Ghidra/IDA for full analysis

[Signatures]
; ============================================================================
; UE4SS-RESOLVED FUNCTIONS (no manual address needed)
; These are resolved by UE4SS via dlsym(RTLD_DEFAULT, ...) on Linux.
; Include them here only if UE4SS fails to resolve them.
; ============================================================================

; [UE4SS-RESOLVED] FName::Constructor
; Resolved via dlsym("FNameCreateConstructor") or heuristic AOB scan
; FName::Constructor=0x0

; [UE4SS-RESOLVED] FName::ToString_Wchar
; Resolved via dlsym("FNameToStringInternal") or heuristic AOB scan
; FName::ToString_Wchar=0x0

; [UE4SS-RESOLVED] FMemory::Free (for GMalloc)
; Resolved via dlsym("GMalloc") on Linux
; FMemory::Free=0x0

; [UE4SS-RESOLVED] UObjectGlobals::StaticFindObject
; Available via UE4SS's UObjectGlobals::StaticFindObject() API after on_unreal_init()
; UObjectGlobals::StaticFindObject=0x0

; [UE4SS-RESOLVED] AGameModeBase::InitGameState
; Resolved via UE4SS VTable hook
; AGameModeBase::InitGameState=0x0

; [UE4SS-RESOLVED] UStruct::StaticLink
; Resolved via UE4SS VTable hook (UStruct::LinkInternal)
; UStruct::StaticLink=0x0

; [UE4SS-RESOLVED] GetObjectsOfClass
; Available via UE4SS's UObjectGlobals::ForEachUObject() or FindAllOf() API
; GetObjectsOfClass=0x0

; ============================================================================
; MANUAL ADDRESS FUNCTIONS (Palworld-specific, must be provided)
; These are Palworld game-specific functions not known to UE4SS.
; You MUST provide actual addresses for these to work.
; ============================================================================

; [MANUAL] Blueprint Loader apply logic
; Search for: "PostLoad" string, find code referencing it
UBlueprintGeneratedClass::PostLoadDefaultObject=0x0

; [MANUAL] Raw Table apply logic
; Search for: "PakPlatformFile" string, find code referencing it
FPakPlatformFile::GetPakFolders=0x9DC96D0

; [MANUAL] Important for running things on the Game Thread
; Search for: "AsyncTask" string, find FAsyncTask::StartBackgroundTask pattern
AsyncTask=0x0

; [MANUAL] UClass methods
; Search for: "AssembleReferenceTokenStream" string
UClass::AssembleReferenceTokenStream=0x0
; Search for: "GetDefaultObject" string, find CDO accessor pattern
UClass::GetDefaultObject=0x0

; [MANUAL] Early type checking
; Search for: MOV RAX, [RDI+8]; MOV RDX, [RDI+8]; TEST RCX,RCX pattern
FField::IsA=0x0

; [MANUAL] Palworld item system
; v1.0.2.101103 ELF: item-container save loop calls the item-slot update
; function at 0x72B2F20; the detour compares _ReturnAddress(), so this is
; the return address immediately after that call (not the ApplySaveData entry).
UPalItemContainer::ApplySaveData=0x729F8E7

; [MANUAL] Palworld dynamic item system
; v1.0.2.101103 ELF: function prologue at 0x7184800 and code xref to
; UTF-16 "ApplyWorldSaveData.AfterApply" at 0x7F53D0.
UPalDynamicItemWorldSubsystem::ApplyWorldSaveData=0x7184800

; The adjacent helper is called by ApplyWorldSaveData at 0x7184A63. Its
; SysV argument setup matches Create_ServerInternal(self, dynamicId, staticId,
; createParam), and it returns immediately into the apply loop.
UPalDynamicItemWorldSubsystem::Create_ServerInternal=0x7184b20

; [MANUAL] Call-resolved signatures
; These manual entries are the final function addresses. Windows obtains
; these through call resolution; Linux has no scanner to perform that step.
FFieldClass::GetNameToFieldClassMap=0x0
UDataTable::Serialize=0xA2FA660
; v1.0.2.101103 ELF: direct target of the save-loop call at 0x729F8E2.
UPalItemSlot::UpdateItem_ServerInternal=0x72B2F20
UWorld::CleanupWorld=0x0
